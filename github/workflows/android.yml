name: Gerar APK do Ttoken

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip \
            python3-pip python3-setuptools \
            python3-wheel libffi-dev libssl-dev \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake autoconf \
            libtool pkg-config

      - name: Instalar Buildozer
        run: |
          python3 -m pip install --user --upgrade pip setuptools wheel
          python3 -m pip install --user "Cython==0.29.36" "buildozer==1.5.0"

      - name: Gerar APK
        env:
          PATH: /home/runner/.local/bin:$PATH
        run: buildozer -v android debug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Ttoken-Escritorio-APK
          path: bin/*.apk
          if-no-files-found: error
